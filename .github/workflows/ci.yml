name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      timeout-minutes: 3
      run: |
        # Errores criticos: sintaxis Python e imports indefinidos
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
          --exclude=node_modules,scratch,.git,dist,agents/_archive,notebooks
        # Advertencias (no bloquea el build)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics \
          --exclude=node_modules,scratch,.git,dist,agents/_archive,notebooks

    - name: Verify docker-compose syntax
      timeout-minutes: 3
      run: |
        docker compose config --quiet
        echo "docker-compose.yml syntax OK"

    - name: Test gateway Dockerfile build
      timeout-minutes: 10
      run: |
        docker build ./gateway --file ./gateway/Dockerfile --tag gateway-test --no-cache
        echo "Gateway Docker build OK"
