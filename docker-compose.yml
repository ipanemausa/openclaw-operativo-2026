services:

  # ─── INFRAESTRUCTURA BASE ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: openclaw_redis
    restart: always
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    container_name: openclaw_db
    restart: always
    environment:
      - POSTGRES_DB=openclaw_prod
      - POSTGRES_USER=openclaw_admin
      - POSTGRES_PASSWORD=SecureDB2026!@#Xyz123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: openclaw_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  # ─── GATEWAY PRINCIPAL (Gemini 2.0 Flash) ──────────────────────
  gateway:
    build: ./gateway
    container_name: openclaw_gateway
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.0-flash
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=openclaw_prod
      - DB_USER=openclaw_admin
      - DB_PASSWORD=SecureDB2026!@#Xyz123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis

  # ─── NGINX REVERSE PROXY ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: openclaw_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - gateway

  # ─── WHATSAPP BOT (Baileys) ─────────────────────────────────────
  whatsapp_service:
    build:
      context: ./services/whatsapp
      dockerfile: Dockerfile
    container_name: openclaw_whatsapp
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - GATEWAY_URL=http://openclaw_gateway:8080/api/mcp/message
    volumes:
      - ./services/whatsapp/auth_info_baileys:/app/auth_info_baileys
    depends_on:
      - gateway

  # ─── RAG FINANCIERO (Qdrant + Gemini Embeddings) ────────────────
  financial_rag_worker:
    build:
      context: ./agents/financial_rag_worker
      dockerfile: Dockerfile
    container_name: financial_rag_worker
    restart: always
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_HOST=qdrant
    ports:
      - "8093:8093"
    depends_on:
      - qdrant

volumes:
  pgdata:
  qdrantdata:
